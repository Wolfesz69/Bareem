
name: Buraimi News Monitor

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buraimi-news-monitor
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Telegram test only on manual runs
      - name: Test Telegram notification
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not token:
              raise RuntimeError("Missing TELEGRAM_BOT_TOKEN secret")

          if not chat_id:
              raise RuntimeError("Missing TELEGRAM_CHAT_ID secret")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": (
                      "✅ Telegram Test Successful!\n\n"
                      "نظام مراقبة أخبار البريمي وعُمان "
                      "متصل بتليجرام.\n\n"
                      "📡 GitHub Actions is working."
                  ),
                  "disable_web_page_preview": True
              },
              timeout=20
          )

          if not response.ok:
              try:
                  error = response.json().get(
                      "description",
                      "Unknown Telegram error"
                  )
              except ValueError:
                  error = "Telegram returned an invalid response"

              print("Telegram error:", error)
              raise RuntimeError(
                  f"Telegram test failed: HTTP {response.status_code}"
              )

          print("Telegram test successful!")
          PY

      # Monitor X accounts through Nitter RSS
      - name: Check X posts and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      # Save processed posts to prevent duplicates
      
      - name: Save monitored posts and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json posts_log.json

          if ! git diff --cached --quiet; then
            git commit -m "Update monitored posts and history"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new posts to save."
          fi
