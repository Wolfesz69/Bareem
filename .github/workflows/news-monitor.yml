
name: Buraimi News Monitor

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  
permissions:
  contents: write

concurrency:
  group: buraimi-news-monitor
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Telegram notification
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              raise RuntimeError("Missing Telegram secrets")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "✅ Bareem News Monitor is connected!",
                  "disable_web_page_preview": True
              },
              timeout=20
          )

          response.raise_for_status()

          if not response.json().get("ok"):
              raise RuntimeError("Telegram test failed")

          print("Telegram test successful!")
          PY

      - name: Check X posts and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save monitored posts and history
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp seen.json /tmp/bareem-seen.json
          cp posts_log.json /tmp/bareem-posts-log.json

          for attempt in 1 2 3; do
            echo "Save attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          from pathlib import Path

          def read_json(filename, default):
              path = Path(filename)

              if not path.exists():
                  return default

              content = path.read_text(encoding="utf-8").strip()

              if not content:
                  return default

              return json.loads(content)

          current_seen = read_json(
              "seen.json",
              {"accounts": {}}
          )

          incoming_seen = read_json(
              "/tmp/bareem-seen.json",
              {"accounts": {}}
          )

          accounts = current_seen.setdefault("accounts", {})

          for username, ids in incoming_seen.get("accounts", {}).items():
              combined = list(dict.fromkeys(
                  accounts.get(username, []) + ids
              ))
              accounts[username] = combined[-500:]

          Path("seen.json").write_text(
              json.dumps(
                  current_seen,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          current_log = read_json("posts_log.json", [])
          incoming_log = read_json("/tmp/bareem-posts-log.json", [])

          records = {}

          for record in current_log + incoming_log:
              if not isinstance(record, dict):
                  continue

              post_id = record.get("id")
              account = record.get("account")

              if not post_id or not account:
                  continue

              key = (account, post_id)
              previous = records.get(key)

              if previous is None:
                  records[key] = record
              elif (
                  record.get("sent_to_telegram")
                  and not previous.get("sent_to_telegram")
              ):
                  records[key] = record

          merged_log = list(records.values())[-5000:]

          Path("posts_log.json").write_text(
              json.dumps(
                  merged_log,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(f"Saved {len(merged_log)} log records")
          PY

            git add seen.json posts_log.json

            if git diff --cached --quiet; then
              echo "No changes to save."
              exit 0
            fi

            git commit -m "Update monitored posts and history"

            if git push origin HEAD:main; then
              echo "History saved successfully."
              exit 0
            fi

            echo "Push failed; retrying..."
            sleep 3
          done

          echo "Failed to save after 3 attempts."
          exit 1
