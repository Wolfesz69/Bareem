
name: Buraimi News Monitor

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buraimi-news-monitor
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Telegram test only on manual runs
      - name: Test Telegram notification
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not token:
              raise RuntimeError("Missing TELEGRAM_BOT_TOKEN secret")

          if not chat_id:
              raise RuntimeError("Missing TELEGRAM_CHAT_ID secret")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": (
                      "✅ Telegram Test Successful!\n\n"
                      "نظام مراقبة أخبار البريمي وعُمان "
                      "متصل بتليجرام.\n\n"
                      "📡 GitHub Actions is working."
                  ),
                  "disable_web_page_preview": True
              },
              timeout=20
          )

          if not response.ok:
              try:
                  error = response.json().get(
                      "description",
                      "Unknown Telegram error"
                  )
              except ValueError:
                  error = "Telegram returned an invalid response"

              print("Telegram error:", error)
              raise RuntimeError(
                  f"Telegram test failed: HTTP {response.status_code}"
              )

          print("Telegram test successful!")
          PY

      # Monitor X accounts through Nitter RSS
      - name: Check X posts and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      # Save processed posts to prevent duplicates
      
      - name: Save monitored posts and history
      
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp seen.json /tmp/bareem-seen.json
          cp posts_log.json /tmp/bareem-posts-log.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          from pathlib import Path

          def read(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (FileNotFoundError, json.JSONDecodeError):
                  return default

          current_seen = read("seen.json", {"accounts": {}})
          new_seen = read("/tmp/bareem-seen.json", {"accounts": {}})

          current_accounts = current_seen.setdefault("accounts", {})

          for username, ids in new_seen.get("accounts", {}).items():
              merged = list(dict.fromkeys(
                  current_accounts.get(username, []) + ids
              ))
              current_accounts[username] = merged[-500:]

          Path("seen.json").write_text(
              json.dumps(current_seen, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          current_log = read("posts_log.json", [])
          new_log = read("/tmp/bareem-posts-log.json", [])

          records = {}
          for record in current_log + new_log:
              if isinstance(record, dict) and record.get("id"):
                  records[record["id"]] = record

          merged_log = list(records.values())[-5000:]

          Path("posts_log.json").write_text(
              json.dumps(merged_log, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

            git add seen.json posts_log.json

            if git diff --cached --quiet; then
              echo "No changes to save."
              exit 0
            fi

            git commit -m "Update monitored posts and history"

            if git push origin HEAD:main; then
              echo "History saved successfully."
              exit 0
            fi

            echo "Push conflict; retrying ($attempt/3)"
            sleep 3
          done

          echo "Failed to save after 3 attempts."
          exit 1

